<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIZARA - Orçamento Final Completo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Arial,sans-serif}
body{background:#f6f5f0;color:#1a1a1a;padding:12px}
#app{max-width:1100px;margin:0 auto}
.header{background:#111;color:#fff;border-radius:18px;padding:18px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative}
#logoEdit{width:64px;height:64px;border-radius:50%;border:3px solid #d4af37;background:#222;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0}
#logoEdit img{width:100%;height:100%;object-fit:cover;display:none}
#logoTxt{font-weight:900;color:#d4af37;font-size:14px;letter-spacing:1px}
.empresaBox{flex:1;min-width:200px}
#nomeEmpresa{font-size:22px;font-weight:800;letter-spacing:0.5px;cursor:pointer}
#subEmpresa,#telEmpresa,#cidadeEmpresa{font-size:12px;opacity:0.8;cursor:pointer;margin-top:2px;display:inline-block;margin-right:12px}
#subEmpresa:hover,#telEmpresa:hover,#cidadeEmpresa:hover,#nomeEmpresa:hover{text-decoration:underline;text-decoration-color:#d4af37}
.topbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.topbar button{border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer;transition:.15s}
#btnZerar{background:#fff;border:1px solid #ddd}
#btnComodo{background:#111;color:#fff}
#btnNovoServ{background:#fff;border:1px solid #111}
#btnLinkPlataforma{background:#d4af37;color:#111}
#btnPdf{background:#16a34a;color:#fff}
.topbar button:hover{transform:translateY(-1px);opacity:.9}
.clienteBar{background:#fff;border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border:1px solid #e9e5d9;margin-bottom:12px}
.clienteBar input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px}
.clienteBar label{font-size:11px;font-weight:700;letter-spacing:.6px;color:#8a7d5a;margin-bottom:4px;display:block}
#bannerPromo{background:#fff8e1;border:1px solid #f3d98a;color:#8a6d00;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#bannerPromo.red{background:#fee2e2;border-color:#fecaca;color:#991b1b}
.mainGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
@media(max-width:800px){.clienteBar{grid-template-columns:1fr}.mainGrid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:16px;border:1px solid #eee;padding:16px}
.card h2{font-size:13px;letter-spacing:1.2px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h2 span.btns button{margin-left:6px;font-size:10px;padding:4px 8px;border-radius:20px;border:1px solid #ddd;background:#fafafa;cursor:pointer}
#listaComodos{display:flex;flex-direction:column;gap:10px}
.comodoItem{border:1px solid #eee;border-radius:12px;padding:10px 12px}
.comodoHead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.comodoHead b{font-size:13px}
.comodoMeta{font-size:11px;color:#666;margin-top:2px}
.servCheck{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.servCheck label{font-size:11px;background:#f6f5f0;border:1px solid #e9e1cc;padding:4px 8px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:4px}
.servCheck label.checked{background:#111;color:#fff;border-color:#111}
#gridServicos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){#gridServicos{grid-template-columns:1fr}}
.servCard{border:1px solid #eee;border-radius:12px;padding:10px}
.servCard b{font-size:12px;display:block}
.servCard small{font-size:10px;color:#888}
.servCard .row{display:flex;gap:6px;margin-top:6px}
.servCard button{font-size:10px;padding:4px 7px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer}
.previa{background:#111;color:#fff;border-radius:16px;padding:16px;margin-top:12px}
.previa h3{font-size:12px;letter-spacing:1px;opacity:.8;margin-bottom:8px}
#clientePrevia{font-size:12px;margin-bottom:8px;line-height:1.5;color:#d4af37}
#totalGeral{font-size:28px;font-weight:900}
#areaLinkPlataforma{display:none;background:#fff;border:2px dashed #d4af37;border-radius:14px;padding:14px;margin-top:12px}
#areaLinkPlataforma textarea{width:100%;height:80px;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:11px;margin:8px 0}
#status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;font-size:11px;display:none;z-index:999}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modalBox{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:380px}
.modalBox h3{font-size:14px;margin-bottom:10px}
.modalBox input,.modalBox select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;font-size:13px}
.modalBox .actions{display:flex;gap:8px;margin-top:6px}
.modalBox .actions button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:12px;cursor:pointer}
.btnPrimary{background:#111;color:#fff}
.btnGhost{background:#f3f3f3}
#printArea{display:none}
#avisoCliente{background:#e0f2fe;border:1px solid #bae6fd;color:#0c4a6e;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div id="logoEdit"><img id="logoImg" alt="logo"><span id="logoTxt">LOGO</span></div>
    <div class="empresaBox">
      <div id="nomeEmpresa">DANILO GESSO</div>
      <div><span id="subEmpresa">CNPJ: 00.000.000/0001-00</span> <span id="telEmpresa">Tel: (00) 00000-0000</span> <span id="cidadeEmpresa">Cidade: Sua Cidade</span></div>

  <div class="topbar">

  <div id="avisoCliente">\uD83D\uDCF1 MODO CLIENTE - Link com dados carregado (limpo=1) - Cliente limitado a 2 cômodos</div>

  <div class="clienteBar">

  <div id="bannerPromo"><span>\uD83C\uDF81 TESTE GRÁTIS 2 CÔMODOS - Ative PRO para ilimitado</span><span id="bannerAcao" style="text-decoration:underline;cursor:pointer">Ativar</span></div>

    <div id="totalGeral">R$ 0,00</div>

    <textarea id="linkGerado" readonly></textarea>
    <div style="display:flex;gap:8px">
      <button id="btnCopiarLink" style="flex:1;background:#111;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer">COPIAR LINK NOVO</button>

      <div style="margin-top:10px;font-size:10px;color:#999">Licenças válidas: DG-PRO-CLIENTE-, KIZARANET-PRO-, KIZA-PRO-, KIZARANET-VITALICIO- + números 1-5000. Ex: DG-PRO-CLIENTE-123</div>

      <input id="editCidadeEmp" placeholder="Cidade">

      <div class="actions"><button class="btnGhost" onclick="fecharModal('modalEditarEmpresa')">Cancelar</button><button id="btnSalvarEmpresa" class="btnPrimary">Salvar</button></div>

<script>
let empresaNome = 'DANILO GESSO';
let empresaSub = 'CNPJ: 00.000.000/0001-00';
let empresaTel = 'Tel: (00) 00000-0000';
let empresaCidade = 'Cidade: Sua Cidade';
let clienteNome = '';
let telefoneCli = '';
let enderecoCli = '';
let comodos = [];
let servicos = [
  {id:1,nome:'Forro liso',valor:35,un:'m2',cat:'Gesso'},
  {id:2,nome:'Sanca aberta',valor:45,un:'ml',cat:'Gesso'},
  {id:3,nome:'Parede drywall',valor:90,un:'m2',cat:'Drywall'}
];

function area(c,l){ c=parseFloat(c)||0; l=parseFloat(l)||0; return c*l; }
function perim(c,l){ c=parseFloat(c)||0; l=parseFloat(l)||0; return 2*(c+l); }

function salvar(){
  try{
    localStorage.setItem('kiza_serv_final', JSON.stringify(servicos));
    localStorage.setItem('kiza_comodos_final', JSON.stringify(comodos));
    localStorage.setItem('kiza_emp_final', empresaNome);
    localStorage.setItem('kiza_sub_final', empresaSub);
    localStorage.setItem('kiza_tel_final', empresaTel);
    localStorage.setItem('kiza_cid_final', empresaCidade);
    localStorage.setItem('kiza_cli_final', clienteNome);
    localStorage.setItem('kiza_tel_cli_final', telefoneCli);
    localStorage.setItem('kiza_end_final', enderecoCli);
  }catch(e){}
}

function showStatus(t){
  let el=document.getElementById('status');
  el.textContent=t; el.style.display='block';
  setTimeout(()=>{el.style.display='none';},2600);
}

function render(){
  // header
  document.getElementById('nomeEmpresa').textContent=empresaNome;
  document.getElementById('subEmpresa').textContent=empresaSub;
  document.getElementById('telEmpresa').textContent=empresaTel;
  document.getElementById('cidadeEmpresa').textContent=empresaCidade;
  // logo
  let logoData=localStorage.getItem('kiza_logo_final');
  let img=document.getElementById('logoImg');
  let txt=document.getElementById('logoTxt');
  if(logoData){ img.src=logoData; img.style.display='block'; txt.style.display='none'; } else { img.style.display='none'; txt.style.display='block'; }
  // cliente inputs already set
  // cliente previa
  let cp=document.getElementById('clientePrevia');
  let htmlCli='';
  if(clienteNome) htmlCli+='Cliente da obra: <b>'+clienteNome+'</b><br>';
  if(telefoneCli) htmlCli+='Telefone: '+telefoneCli+'<br>';
  if(enderecoCli) htmlCli+='Endereço: '+enderecoCli+'<br>';
  cp.innerHTML=htmlCli;

  // comodos lista
  let lista=document.getElementById('listaComodos');
  lista.innerHTML='';
  if(comodos.length===0){ lista.innerHTML='<div style="font-size:12px;color:#999;padding:12px;border:1px dashed #ddd;border-radius:10px;text-align:center">Nenhum cômodo ainda. Clique em + COMODO (limite grátis 2).</div>'; }
  else{
    comodos.forEach((c,idx)=>{
      let a=area(c.c,c.l); let p=perim(c.c,c.l);
      let div=document.createElement('div'); div.className='comodoItem';
      let servChecks=servicos.map(s=>{
        let checked=c.servicos.includes(s.id);
        return '<label class="'+(checked?'checked':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleServico('+idx+','+s.id+')" style="display:none"> '+s.nome+' R$'+s.valor+'/'+s.un+'</label>';
      }).join('');
      div.innerHTML='<div class="comodoHead"><div><b>'+c.nome+'</b><div class="comodoMeta">'+c.c+' x '+c.l+' = '+a.toFixed(2)+'m² / '+p.toFixed(2)+'ml</div></div><button onclick="removerComodo('+idx+')" style="border:none;background:#fee2e2;color:#991b1b;padding:4px 8px;border-radius:20px;font-size:10px;cursor:pointer">X</button></div><div class="servCheck">'+servChecks+'</div>';
      lista.appendChild(div);
    });
  }

  // servicos grid
  let grid=document.getElementById('gridServicos');
  grid.innerHTML='';
  servicos.forEach(s=>{
    let d=document.createElement('div'); d.className='servCard';
    d.innerHTML='<b>'+s.nome+'</b><small>'+s.cat+' • R$'+s.valor.toFixed(2)+' / '+s.un+'</small><div class="row"><button onclick="editarNome('+s.id+')">Editar nome</button><button onclick="editarPreco('+s.id+')">Preço</button><button onclick="removerServico('+s.id+')" style="color:#991b1b">Remover</button></div>';
    grid.appendChild(d);
  });

  // previa e total
  let total=0;
  let previaHtml='';
  comodos.forEach(c=>{
    let a=area(c.c,c.l); let p=perim(c.c,c.l);
    previaHtml+='<div><b>'+c.nome+' - '+c.c+'x'+c.l+' = '+a.toFixed(2)+'m²</b></div>';
    c.servicos.forEach(sid=>{
      let s=servicos.find(x=>x.id==sid); if(!s) return;
      let base=s.un=='m2'?a:s.un=='ml'?p:1;
      let v=base*s.valor;
      total+=v;
      previaHtml+='<div style="margin-left:8px">- '+s.nome+' : R$'+v.toFixed(2)+' ('+base.toFixed(2)+s.un+' x R$'+s.valor+')</div>';
    });
  });
  document.getElementById('previaComodos').innerHTML=previaHtml||'<span style="opacity:.6">Adicione cômodos e serviços</span>';
  document.getElementById('totalGeral').textContent='R$ '+total.toFixed(2);
  salvar();
}

function editarNome(id){
  let s=servicos.find(x=>x.id==id); if(!s) return;
  let n=prompt('Novo nome:', s.nome); if(n){ s.nome=n; render(); }
}
function editarPreco(id){
  let s=servicos.find(x=>x.id==id); if(!s) return;
  let n=prompt('Novo preço:', s.valor); if(n!==null){ s.valor=parseFloat(n)||0; render(); }
}
function removerServico(id){
  if(!confirm('Remover serviço?')) return;
  servicos=servicos.filter(x=>x.id!=id);
  comodos.forEach(c=>{ c.servicos=c.servicos.filter(sid=>sid!=id); });
  render();
}
function toggleServico(cIdx, sId){
  let c=comodos[cIdx]; if(!c) return;
  if(c.servicos.includes(sId)) c.servicos=c.servicos.filter(x=>x!=sId); else c.servicos.push(sId);
  render();
}
function removerComodo(idx){ if(!confirm('Remover cômodo?')) return; comodos.splice(idx,1); render(); }
function limparComodos(){ if(!confirm('Limpar cômodos?')) return; comodos=[]; render(); showStatus('Cômodos limpos'); }
function limparServicos(){ if(!confirm('Limpar serviços?')) return; servicos=[]; render(); }
function limparTudo(){
  if(!confirm('COMEÇAR DO ZERO - limpar tudo?')) return;
  comodos=[]; servicos=[]; clienteNome=''; telefoneCli=''; enderecoCli='';
  document.getElementById('inputClienteTop').value=''; document.getElementById('inputTelefoneTop').value=''; document.getElementById('inputEnderecoTop').value='';
  localStorage.removeItem('kiza_comodos_final'); localStorage.removeItem('kiza_serv_final');
  localStorage.removeItem('kiza_cli_final'); localStorage.removeItem('kiza_tel_cli_final'); localStorage.removeItem('kiza_end_final');
  localStorage.setItem('kiza_dono','1');
  render(); showStatus('Tudo limpo - começo branco');
}

function criarComodo(){
  let nome=document.getElementById('mNome').value.trim();
  let c=document.getElementById('mC').value; let l=document.getElementById('mL').value;
  if(!nome){ alert('Nome obrigatório'); return; }
  if(!c || !l){ alert('Medidas obrigatórias'); return; }
  comodos.push({nome:nome,c:parseFloat(c),l:parseFloat(l),servicos:[]});
  document.getElementById('mNome').value=''; document.getElementById('mC').value=''; document.getElementById('mL').value='';
  fecharModal('modal'); render(); showStatus('Cômodo criado');
}
function criarServ(){
  let nome=document.getElementById('nsNome').value.trim();
  let preco=parseFloat(document.getElementById('nsPreco').value)||0;
  let un=document.getElementById('nsUn').value; let cat=document.getElementById('nsCat').value||'Geral';
  if(!nome){ alert('Nome obrigatório'); return; }
  let id=Date.now();
  servicos.push({id:id,nome:nome,valor:preco,un:un,cat:cat});
  document.getElementById('nsNome').value=''; document.getElementById('nsPreco').value=''; document.getElementById('nsCat').value='';
  fecharModal('modalNovoServ'); render(); showStatus('Serviço criado');
}

function verificarLimiteGratis(){
  let isDono=localStorage.getItem('kiza_dono')==='1';
  let url=new URLSearchParams(window.location.search);
  let hasLimpo=url.has('limpo');
  let hasLic=url.has('lic');
  let isPro=localStorage.getItem('kiza_pro')==='1' || hasLic;
  if(isDono && !hasLimpo){ return true; }
  if(isPro){ return true; }
  if(comodos.length>=2){
    abrirModal('modalLic');
    let banner=document.getElementById('bannerPromo'); banner.classList.add('red');
    banner.innerHTML='<span>\uD83D\uDD12 LIMITE: 2 cômodos grátis - Ative PRO!</span><span id="+"bannerAcao" style="text-decoration:underline;cursor:pointer">Ativar PRO</span>';
    document.getElementById('bannerAcao')?.addEventListener('click',()=>abrirModal('modalLic'));
    showStatus('\uD83D\uDD12 LIMITE: 2 cômodos grátis - Ative PRO!');
    return false;
  }
  return true;
}

function gerarLinkPlataforma(){
  if(comodos.length===0){ alert('Adicione pelo menos 1 cômodo antes de gerar link'); return; }
  let dadosObj={comodos:comodos,servicos:servicos,t:Date.now()};
  let json=JSON.stringify(dadosObj);
  let b64='';
  try{ b64=btoa(encodeURIComponent(json)); }catch(e){ b64=btoa(unescape(encodeURIComponent(json))); }
  let baseUrl='https://kizaracom-code.github.io/kizara-orcamento-editavel/';
  let params=new URLSearchParams();
  params.set('empresa', empresaNome);
  params.set('sub', empresaSub);
  params.set('tel', empresaTel);
  params.set('cid', empresaCidade);
  params.set('dados', b64);
  params.set('limpo','1');
  let link=baseUrl+'?'+params.toString();
  let box=document.getElementById('areaLinkPlataforma');
  let ta=document.getElementById('linkGerado');
  ta.value=link; box.style.display='block';
  document.getElementById('btnCopiarLink').onclick=()=>{
    navigator.clipboard.writeText(link).then(()=>showStatus('Link copiado!'));
  };
  document.getElementById('btnAbrirCel').onclick=()=>{ window.open(link,'_blank'); };
  box.scrollIntoView({behavior:'smooth'});
  showStatus('Link gerado!');
}

function gerarPDF(){
 showStatus('Gerando PDF...');
 try{
  let { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  let y=10;
  doc.setFontSize(16); doc.text(empresaNome, 10, y); y+=7;
  doc.setFontSize(9); doc.text(empresaSub + ' | ' + empresaTel + ' | ' + empresaCidade, 10, y); y+=7;
  if(clienteNome){ doc.setFontSize(11); doc.text('Cliente da obra: ' + clienteNome, 10, y); y+=6; }
  if(telefoneCli){ doc.text('Telefone: ' + telefoneCli, 10, y); y+=6; }
  if(enderecoCli){ doc.text('Endereco: ' + enderecoCli, 10, y); y+=8; }
  doc.setFontSize(12); doc.text('COMODOS:', 10, y); y+=6;
  comodos.forEach(c=>{
    let a=area(c.c,c.l); let p=perim(c.c,c.l);
    doc.setFontSize(10); doc.text(c.nome + ' - ' + c.c + 'x' + c.l + ' = ' + a.toFixed(2) + 'm2 / ' + p.toFixed(2) + 'ml', 10, y); y+=5;
    c.servicos.forEach(sid=>{
      let s=servicos.find(x=>x.id==sid); if(!s)return;
      let base=s.un=='m2'?a:s.un=='ml'?p:1; let v=base*s.valor;
      doc.setFontSize(8); doc.text('  - ' + s.nome + ' : R$' + v.toFixed(2), 12, y); y+=4;
      if(y>280){ doc.addPage(); y=10; }
    });
    y+=2;
  });
  let total=0; comodos.forEach(c=>{ let a=area(c.c,c.l); let p=perim(c.c,c.l); c.servicos.forEach(sid=>{ let s=servicos.find(x=>x.id==sid); if(!s)return; let base=s.un=='m2'?a:s.un=='ml'?p:1; total+=base*s.valor; }); });
  y+=4; doc.setFontSize(14); doc.text('TOTAL GERAL: R$ ' + total.toFixed(2), 10, y);
  doc.save('orcamento-' + (clienteNome||'cliente') + '.pdf');
  showStatus('PDF baixado!');
 }catch(e){
  let printArea=document.getElementById('printArea');
  if(printArea){
    let html='<h2>'+empresaNome+'</h2><p>'+empresaSub+' | '+empresaTel+' | '+empresaCidade+'</p>';
    if(clienteNome) html+='<p>Cliente obra: '+clienteNome+' | Tel: '+telefoneCli+' | End: '+enderecoCli+'</p>';
    html+='<h3>Comodos</h3>';
    comodos.forEach(c=>{ let a=area(c.c,c.l); html+='<p><b>'+c.nome+' - '+c.c+'x'+c.l+' = '+a.toFixed(2)+'m2</b></p>'; c.servicos.forEach(sid=>{ let s=servicos.find(x=>x.id==sid); if(s){ let base=s.un=='m2'?a:perim(c.c,c.l); if(s.un=='un')base=1; html+='<div>'+s.nome+' - R$'+(base*s.valor).toFixed(2)+'</div>'; }}); });
    let total=0; comodos.forEach(c=>{ let a=area(c.c,c.l); let p=perim(c.c,c.l); c.servicos.forEach(sid=>{ let s=servicos.find(x=>x.id==sid); if(!s)return; let base=s.un=='m2'?a:s.un=='ml'?p:1; total+=base*s.valor; }); });
    html+='<h2>TOTAL: R$ '+total.toFixed(2)+'</h2>';
    printArea.innerHTML=html; printArea.style.display='block'; window['pri'+'nt'](); setTimeout(()=>{printArea.style.display='none';},500);
  }
  showStatus('PDF gerado via impressao!');
 }
}

function abrirModal(id){ document.getElementById(id).style.display='flex'; }
function fecharModal(id){ document.getElementById(id).style.display='none'; }
function editarBanner(){}
function abrirModalEditarEmpresa(){
  document.getElementById('editNomeEmp').value=empresaNome;
  document.getElementById('editSubEmp').value=empresaSub;
  document.getElementById('editTelEmp').value=empresaTel;
  document.getElementById('editCidadeEmp').value=empresaCidade;
  abrirModal('modalEditarEmpresa');
}

document.addEventListener('DOMContentLoaded',()=>{
  let params=new URLSearchParams(window.location.search);
  let emp=params.get('empresa');
  let sub=params.get('sub');
  let tel=params.get('tel');
  let cid=params.get('cid');
  let dados=params.get('dados');
  let limpo=params.get('limpo');
  let lic=params.get('lic');

  if(!emp && !dados && !limpo){
    comodos=[]; servicos=[];
    localStorage.removeItem('kiza_comodos_final');
    localStorage.removeItem('kiza_serv_final');
    localStorage.setItem('kiza_dono','1');
  }
  if(emp){ empresaNome=emp; localStorage.setItem('kiza_emp_final', emp); }
  if(sub){ empresaSub=sub; localStorage.setItem('kiza_sub_final', sub); }
  if(tel){ empresaTel=tel; localStorage.setItem('kiza_tel_final', tel); }
  if(cid){ empresaCidade=cid; localStorage.setItem('kiza_cid_final', cid); }
  if(dados){
    try{
      let decoded=atob(dados);
      try{ decoded=decodeURIComponent(decoded); }catch(e){ try{ decoded=decodeURIComponent(escape(decoded)); }catch(e2){} }
      let obj=JSON.parse(decoded);
      if(obj.comodos){ comodos=obj.comodos; }
      if(obj.servicos){ servicos=obj.servicos; }
      localStorage.setItem('kiza_comodos_final', JSON.stringify(comodos));
      localStorage.setItem('kiza_serv_final', JSON.stringify(servicos));
    }catch(e){ console.log('erro dados', e); }
  }
  if(limpo){
    localStorage.removeItem('kiza_dono');
    document.getElementById('avisoCliente').style.display='block';
  }

  // Load from localStorage
  try{
    let lsServ=localStorage.getItem('kiza_serv_final');
    let lsCom=localStorage.getItem('kiza_comodos_final');
    let lsLogo=localStorage.getItem('kiza_logo_final');
    let lsEmp=localStorage.getItem('kiza_emp_final');
    let lsSub=localStorage.getItem('kiza_sub_final');
    let lsTel=localStorage.getItem('kiza_tel_final');
    let lsCid=localStorage.getItem('kiza_cid_final');
    let lsCli=localStorage.getItem('kiza_cli_final');
    let lsTelCli=localStorage.getItem('kiza_tel_cli_final');
    let lsEnd=localStorage.getItem('kiza_end_final');
    if(lsServ && (emp || dados || limpo || localStorage.getItem('kiza_serv_final'))){ try{ servicos=JSON.parse(lsServ); }catch(e){} }
    if(lsCom && (emp || dados || limpo || localStorage.getItem('kiza_comodos_final'))){ try{ comodos=JSON.parse(lsCom); }catch(e){} }
    if(lsEmp && !emp) empresaNome=lsEmp;
    if(lsSub && !sub) empresaSub=lsSub;
    if(lsTel && !tel) empresaTel=lsTel;
    if(lsCid && !cid) empresaCidade=lsCid;
    if(lsCli){ clienteNome=lsCli; document.getElementById('inputClienteTop').value=lsCli; }
    if(lsTelCli){ telefoneCli=lsTelCli; document.getElementById('inputTelefoneTop').value=lsTelCli; }
    if(lsEnd){ enderecoCli=lsEnd; document.getElementById('inputEnderecoTop').value=lsEnd; }
    if(!emp && !dados && !limpo){
      // owner pure already cleared, keep empty if localStorage was cleared
      if(!localStorage.getItem('kiza_dono')){ /* keep loaded */ } else { comodos=[]; servicos=[]; }
    }
  }catch(e){}

  // listeners
  document.getElementById('logoEdit').addEventListener('click',()=>{ document.getElementById('inputLogo').click(); });
  document.getElementById('nomeEmpresa').addEventListener('click', abrirModalEditarEmpresa);
  document.getElementById('subEmpresa').addEventListener('click', abrirModalEditarEmpresa);
  document.getElementById('telEmpresa').addEventListener('click', abrirModalEditarEmpresa);
  document.getElementById('cidadeEmpresa').addEventListener('click', abrirModalEditarEmpresa);

  document.getElementById('inputLogo').addEventListener('change', (e)=>{
    let file=e.target.files[0]; if(!file) return;
    let reader=new FileReader();
    reader.onload=(ev)=>{
      localStorage.setItem('kiza_logo_final', ev.target.result);
      render();
      showStatus('Logo salvo!');
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('inputClienteTop').addEventListener('input', (e)=>{ clienteNome=e.target.value; localStorage.setItem('kiza_cli_final', clienteNome); render(); });
  document.getElementById('inputTelefoneTop').addEventListener('input', (e)=>{ telefoneCli=e.target.value; localStorage.setItem('kiza_tel_cli_final', telefoneCli); render(); });
  document.getElementById('inputEnderecoTop').addEventListener('input', (e)=>{ enderecoCli=e.target.value; localStorage.setItem('kiza_end_final', enderecoCli); render(); });

  document.getElementById('btnPdf').addEventListener('click', gerarPDF);
  document.getElementById('btnLinkPlataforma').addEventListener('click', gerarLinkPlataforma);
  document.getElementById('btnComodo').addEventListener('click', ()=>{ if(verificarLimiteGratis()) abrirModal('modal'); });
  document.getElementById('btnNovoServ').addEventListener('click', ()=>{ abrirModal('modalNovoServ'); });
  document.getElementById('btnCriarComodo').addEventListener('click', ()=>{ if(verificarLimiteGratis()) criarComodo(); });
  document.getElementById('btnCriarServ').addEventListener('click', criarServ);
  document.getElementById('btnSalvarEmpresa').addEventListener('click', ()=>{
    empresaNome=document.getElementById('editNomeEmp').value||empresaNome;
    empresaSub=document.getElementById('editSubEmp').value||empresaSub;
    empresaTel=document.getElementById('editTelEmp').value||empresaTel;
    empresaCidade=document.getElementById('editCidadeEmp').value||empresaCidade;
    localStorage.setItem('kiza_emp_final', empresaNome);
    localStorage.setItem('kiza_sub_final', empresaSub);
    localStorage.setItem('kiza_tel_final', empresaTel);
    localStorage.setItem('kiza_cid_final', empresaCidade);
    fecharModal('modalEditarEmpresa'); render(); showStatus('Empresa salva!');
  });
  document.getElementById('btnZerar').addEventListener('click', limparTudo);
  document.getElementById('btnAtivarPro').addEventListener('click', ()=>{
    let licVal=document.getElementById('inputLic').value.trim();
    let bloqueada=[];
    let validas=['DG-PRO-CLIENTE-','KIZARANET-PRO-','KIZA-PRO-','KIZARANET-VITALICIO-'];
    let regex=/^(DG-PRO-CLIENTE-|KIZARANET-PRO-|KIZA-PRO-|KIZARANET-VITALICIO-)(\\d+)$/;
    // also allow 1-5000
    if(!licVal){ alert('Digite a licença'); return; }
    if(bloqueada.includes(licVal)){ alert('Licença bloqueada'); return; }
    let m=licVal.match(/^(DG-PRO-CLIENTE-|KIZARANET-PRO-|KIZA-PRO-|KIZARANET-VITALICIO-)(\\d+)$/);
    if(!m){ alert('Licença inválida. Use formato: DG-PRO-CLIENTE-123'); return; }
    let num=parseInt(m[2],10);
    if(num<1 || num>5000){ alert('Licença fora do intervalo 1-5000'); return; }
    let ok=validas.some(p=>licVal.startsWith(p));
    if(ok){
      localStorage.setItem('kiza_pro','1');
      localStorage.setItem('kiza_licenca', licVal);
      fecharModal('modalLic');
      let banner=document.getElementById('bannerPromo'); banner.classList.remove('red'); banner.style.background='#dcfce7'; banner.style.borderColor='#86efac'; banner.style.color='#14532d';
      banner.innerHTML='<span>✅ PRO ATIVO - Ilimitado liberado ('+licVal+')</span><span>OK</span>';
      showStatus('PRO ativado! '+licVal);
    } else {
      alert('Licença não reconhecida');
    }
  });
  document.getElementById('btnAtivarPro2').addEventListener('click', ()=>{ abrirModal('modalLic'); });
  document.getElementById('bannerAcao').addEventListener('click', ()=>{ abrirModal('modalLic'); });

  // close modals on overlay click
  document.querySelectorAll('.modalOverlay').forEach(ov=>{
    ov.addEventListener('click', (e)=>{ if(e.target===ov) fecharModal(ov.id); });
  });

  render();
  if(comodos.length>=2 && !localStorage.getItem('kiza_pro') && !params.has('lic') && localStorage.getItem('kiza_dono')!=='1'){
    document.getElementById('bannerPromo').classList.add('red');
  }
});
<\/script>
</body>
</html>
